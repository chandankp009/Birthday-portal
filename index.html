<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Indira ♡ | Our Memories</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    color:#f7eafa;
    background:
        radial-gradient(circle at 10% 15%,rgba(200,60,160,.22),transparent 25%),
        radial-gradient(circle at 90% 10%,rgba(255,70,150,.20),transparent 25%),
        radial-gradient(circle at 50% 70%,rgba(120,50,180,.13),transparent 30%),
        linear-gradient(135deg,#08030e,#120619,#07030d);
    min-height:100vh;
}

/* soft cinematic lights */

body::before,
body::after{
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.15;
    pointer-events:none;
    z-index:-1;
}

body::before{
    background:#ff3f9d;
    top:100px;
    left:-120px;
}

body::after{
    background:#9b4dff;
    right:-120px;
    top:400px;
}


/* NAVBAR */

nav{
    position:sticky;
    top:0;
    z-index:100;
    height:62px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    background:rgba(8,3,14,.82);
    backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,120,210,.22);
}

.logo{
    font-family:'Cormorant Garamond',serif;
    font-size:32px;
    font-style:italic;
    color:#ff86d5;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    color:#caa9c7;
    text-decoration:none;
    font-size:12px;
    transition:.3s;
}

.nav-links a:hover{
    color:#ff79ca;
}


/* HERO */

.hero{
    min-height:80vh;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    padding:80px 20px;
}

.eyebrow{
    color:#d67ac1;
    letter-spacing:4px;
    font-size:11px;
    text-transform:uppercase;
}

.hero h1{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(80px,14vw,155px);
    font-style:italic;
    line-height:.85;
    margin:25px 0;

    background:linear-gradient(
        90deg,
        #ff9bdf,
        #c77bff,
        #ff62bd
    );

    -webkit-background-clip:text;
    color:transparent;
}

.hero p{
    color:#d9c5d7;
    font-size:17px;
    line-height:1.8;
}

.heart{
    color:#ff73c8;
}


/* SECTIONS */

section{
    padding:90px 5%;
}

.section-title{
    text-align:center;
    margin-bottom:45px;
}

.section-title h2{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:60px;
    color:#efa0dc;
    margin:12px 0;
}

.section-title p{
    color:#c8b2c6;
    line-height:1.7;
}


/* LETTER */

.letter-box{
    max-width:850px;
    margin:auto;

    padding:40px;

    border-radius:25px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,120,210,.20);

    box-shadow:0 25px 80px rgba(0,0,0,.35);

    backdrop-filter:blur(15px);
}

.letter-box p{
    color:#d6c6d5;
    line-height:1.9;
    margin-bottom:18px;
}

.signature{
    text-align:right;
    font-family:'Cormorant Garamond',serif;
    font-size:27px;
    color:#ff8bd5!important;
}


/* JOURNEY */

.journey-grid{
    max-width:1000px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.journey-card{
    text-align:center;
    padding:28px 18px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,120,210,.18);

    border-radius:20px;
}

.journey-card h3{
    color:#ff8bd4;
    margin-bottom:10px;
}

.journey-card p{
    color:#c6b4c4;
    font-size:13px;
}


/* ==================================================
   PREMIUM CINEMATIC GALLERY
================================================== */

.gallery-wrapper{
    max-width:1200px;
    margin:auto;

    padding:22px;

    background:rgba(7,3,15,.65);

    border:1px solid rgba(255,110,210,.25);

    border-radius:28px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.45),
        inset 0 0 50px rgba(255,50,180,.025);
}

.gallery{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:14px;
}


/* PHOTO CARD */

.photo{
    position:relative;
    overflow:hidden;

    border-radius:15px;

    background:#100718;

    border:1px solid rgba(255,130,220,.25);

    cursor:pointer;

    transition:
        transform .4s ease,
        border-color .4s ease,
        box-shadow .4s ease;
}
