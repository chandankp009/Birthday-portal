<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Indira ❤️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff0f5, #ffe4ec);
    color: #4a2433;
    line-height: 1.7;
}

/* HERO */

.hero {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

.hero-content {
    max-width: 700px;
    animation: heroAppear 1.5s ease;
}

.small-text {
    font-size: 18px;
    margin-bottom: 10px;
}

.hero h1 {
    font-size: 60px;
    color: white;
    margin-bottom: 15px;
    animation: heartbeat 2s infinite;
}

.hero h2 {
    font-size: 25px;
    color: #fff;
    font-weight: normal;
}

.birthday {
    margin-top: 25px;
    display: inline-block;
    background: white;
    color: #e75480;
    padding: 12px 25px;
    border-radius: 30px;
    font-weight: bold;
    box-shadow: 0 8px 25px rgba(180, 50, 90, 0.18);
}

/* GENERAL */

section {
    padding: 80px 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
    text-align: center;
}

.badge {
    display: inline-block;
    background: #fff;
    color: #e75480;
    padding: 8px 18px;
    border-radius: 30px;
    margin-bottom: 20px;
    font-weight: bold;
    box-shadow: 0 5px 15px rgba(200, 70, 110, 0.08);
}

h2 {
    font-size: 38px;
    margin-bottom: 20px;
    color: #c43d68;
}

p {
    font-size: 18px;
}

/* LETTER */

.letter {
    background: white;
}

.letter-box {
    background: #fff7fa;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    text-align: left;
    max-width: 800px;
    margin: auto;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
}

.letter-box:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(200, 70, 110, 0.15);
}

.letter-box p {
    margin-bottom: 18px;
}

.signature {
    text-align: right;
    font-size: 22px;
    color: #d94f78;
    font-weight: bold;
}

/* JOURNEY */

.journey {
    background: linear-gradient(135deg, #fff5f8, #ffe8ef);
}

.timeline {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-top: 40px;
}

.timeline-card {
    background: white;
    padding: 25px 15px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
}

.timeline-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 30px rgba(200, 70, 110, 0.15);
}

.timeline-card h3 {
    color: #e75480;
    margin-bottom: 10px;
}

/* MEMORIES */

.memories {
    background: white;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
    margin-top: 40px;
}

.photo {
    background: #fff7fa;
    padding: 12px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.10);
    transition:
        transform 0.5s ease,
        box-shadow 0.5s ease;
    overflow: hidden;

    opacity: 0;
    transform: translateY(50px) scale(0.96);
    animation: photoReveal 0.9s ease forwards;
}

/* Each photo appears one after another */

.photo:nth-child(1) {
    animation-delay: 0.1s;
}

.photo:nth-child(2) {
    animation-delay: 0.2s;
}

.photo:nth-child(3) {
    animation-delay: 0.3s;
}

.photo:nth-child(4) {
    animation-delay: 0.4s;
}

.photo:nth-child(5) {
    animation-delay: 0.5s;
}

.photo:nth-child(6) {
    animation-delay: 0.6s;
}

.photo:nth-child(7) {
    animation-delay: 0.7s;
}

.photo:nth-child(8) {
    animation-delay: 0.8s;
}

.photo:nth-child(9) {
    animation-delay: 0.9s;
}

.photo:nth-child(10) {
    animation-delay: 1s;
}

.photo:nth-child(11) {
    animation-delay: 1.1s;
}

.photo:hover {
    transform: translateY(-8px) scale(1.015);
    box-shadow: 0 18px 35px rgba(200, 60, 110, 0.20);
}

.photo img {
    width: 100%;
    height: 350px;
    object-fit: contain;
    border-radius: 15px;
    display: block;
    background: #fff0f5;
    transition: transform 0.6s ease;
}

.photo:hover img {
    transform: scale(1.025);
}

.photo p {
    padding: 12px 5px 5px;
    color: #b63c63;
    font-size: 16px;
    transition: transform 0.4s ease;
}

.photo:hover p {
    transform: translateY(-2px);
}

/* THINGS I LOVE */

.things {
    background: linear-gradient(135deg, #ffe8ef, #fff4f7);
}

.love-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 40px;
}

.love-card {
    background: white;
    padding: 30px 15px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
}

.love-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 30px rgba(200, 70, 110, 0.15);
}

.love-card h3 {
    color: #e75480;
    margin-bottom: 10px;
}

/* SURPRISE */

.surprise {
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    color: white;
    text-align: center;
    position: relative;
    overflow: hidden;
}

/* Soft glowing circles */

.surprise::before,
.surprise::after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    animation: floatingCircle 6s ease-in-out infinite;
}

.surprise::before {
    top: -60px;
    left: -50px;
}

.surprise::after {
    bottom: -70px;
    right: -50px;
    animation-delay: 2s;
}

.s
